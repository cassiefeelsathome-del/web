    <html>
        <head>
            <link rel="stylesheet" href="index.css">
            <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        </head>
        <body>
            <div class="container">
                <div>
                    <h3 class="teams">HOME</h3>
                    <h1 id="home-el" class="score">0</h1>
                    <button class="btn home" onclick="addThree(this)">+3</button>
                    <button class="btn home" onclick="addTwo(this)">+2</button>
                    <button class="btn home" onclick="addOne(this)">+1</button>
                </div>
                <div id="clear" ><button class="btn" onclick="clearScore()">Clear</button></div>  
                <div>
                    <h3 class="teams">GUEST</h3>
                    <h1 id="guest-el" class="score">0</h1>
                    <button class="btn guest" onclick="addThree(this)">+3</button>
                    <button class="btn guest" onclick="addTwo(this)">+2</button>
                    <button class="btn guest" onclick="addOne(this)">+1</button>
                </div>
                
                
            </div>
            <script src="index.js"></script>
        </body>
    </html>
